# fly.toml app configuration file generated for ruger-voice on 2026-09-23T13:18:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ruger-voice'
primary_region = 'arn'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
